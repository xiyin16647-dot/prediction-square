<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Prediction Square · 管理后台</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Source+Serif+4:wght@600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin:0; padding:0; height:100%; background:#F7F8FA; }
  body { font-family: 'Inter', -apple-system, sans-serif; }
  *, *::before, *::after { box-sizing: border-box; }
  #admin-root { width:100%; height:100vh; }
</style>
</head>
<body>
<div id="admin-root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="admin-tokens.js"></script>
<script src="admin-data.js"></script>
<script type="text/babel" src="admin.jsx"></script>
<script type="text/babel">
  const root = ReactDOM.createRoot(document.getElementById('admin-root'));
  function Boot(){
    const [mobile, setMobile] = React.useState(window.innerWidth < 760);
    React.useEffect(() => {
      const onR = () => setMobile(window.innerWidth < 760);
      window.addEventListener('resize', onR);
      return () => window.removeEventListener('resize', onR);
    }, []);
    return <window.AdminApp mobile={mobile} />;
  }
  root.render(<Boot />);
</script>
</body>
</html>
