<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prediction Square 先行版 — 原型 v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;0,700;1,600;1,700&family=Noto+Serif+SC:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #E9E6DF; }
  body { font-family: 'Inter', -apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif; }
  * { box-sizing: border-box; }
  button { font-family: inherit; }
  div::-webkit-scrollbar, button::-webkit-scrollbar { width: 0; height: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script src="data.js"></script>
<script src="data-ext.js"></script>
<script src="theme.js"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="page-square.jsx"></script>
<script type="text/babel" src="page-detail.jsx"></script>
<script type="text/babel" src="page-other.jsx"></script>

<script type="text/babel">
const { DesignCanvas, DCSection, DCArtboard,
        Phone, TabBar, SquarePage, DetailPage, RankPage, MessagesPage, MePage, PlusSheet,
        TweaksPanel, useTweaks, TweakSection, TweakRadio, TweakToggle } = window;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "density": "medium",
  "showAllPages": true
}/*EDITMODE-END*/;

// Single phone with full nav (used as the main interactive prototype)
function Prototype({ initial = 'square', initialDetail = null, theme, density }) {
  const c = window.PSQ_THEME[theme] || window.PSQ_THEME.light;
  const dense = density === 'high';
  const [tab, setTab] = React.useState(initial);
  const [detail, setDetail] = React.useState(initialDetail);
  const [showPlus, setShowPlus] = React.useState(false);

  const openDetail = (id) => setDetail(id);
  const closeDetail = () => setDetail(null);
  const onTab = (k) => {
    if (k === 'plus') { setShowPlus(true); return; }
    setDetail(null); setTab(k);
  };

  const screenLabel = detail ? '06 预测详情' :
    ({ square: '01 广场（首页）', rank: '02 排行榜', msg: '04 消息', me: '05 我的' }[tab] || tab);

  return (
    <Phone c={c} screenLabel={screenLabel}>
      {/* Status bar */}
      <div style={{ height: 44, padding: '0 22px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontFamily: window.PSQ_FONTS.sans, fontSize: 15, color: c.text, fontWeight: 600, flexShrink: 0 }}>
        <span>9:41</span>
        <span style={{ width: 16, height: 10, borderRadius: 2.5, border: `1.4px solid ${c.text}`, position: 'relative' }}>
          <span style={{ position: 'absolute', inset: 1.4, background: c.text, width: '78%', borderRadius: 1 }} />
        </span>
      </div>

      {detail ? (
        <DetailPage c={c} eventId={detail} onBack={closeDetail} />
      ) : (
        tab === 'square' ? <SquarePage c={c} dense={dense} onOpen={openDetail} onOpenRank={() => setTab('rank')} /> :
        tab === 'rank'   ? <RankPage c={c} /> :
        tab === 'msg'    ? <MessagesPage c={c} /> :
        tab === 'me'     ? <MePage c={c} /> : null
      )}

      {!detail && <TabBar c={c} active={tab} onChange={onTab} />}
      {showPlus && <PlusSheet c={c} onClose={() => setShowPlus(false)} />}
    </Phone>
  );
}

// Static screen (no nav state) used for showing all pages side by side in the canvas
function StaticScreen({ kind, theme, density, eventId }) {
  const c = window.PSQ_THEME[theme] || window.PSQ_THEME.light;
  const dense = density === 'high';
  const screenLabel = ({ square: '01 广场', rank: '02 排行榜', msg: '04 消息', me: '05 我的', detail: '06 预测详情' }[kind]) || kind;
  return (
    <Phone c={c} screenLabel={screenLabel}>
      <div style={{ height: 44, padding: '0 22px', display: 'flex', alignItems: 'center', justifyContent: 'space-between', fontFamily: window.PSQ_FONTS.sans, fontSize: 15, color: c.text, fontWeight: 600, flexShrink: 0 }}>
        <span>9:41</span>
        <span style={{ width: 16, height: 10, borderRadius: 2.5, border: `1.4px solid ${c.text}`, position: 'relative' }}>
          <span style={{ position: 'absolute', inset: 1.4, background: c.text, width: '78%', borderRadius: 1 }} />
        </span>
      </div>
      {kind === 'square' && <SquarePage c={c} dense={dense} onOpen={() => {}} onOpenRank={() => {}} />}
      {kind === 'rank'   && <RankPage c={c} />}
      {kind === 'msg'    && <MessagesPage c={c} />}
      {kind === 'me'     && <MePage c={c} />}
      {kind === 'detail' && <DetailPage c={c} eventId={eventId || 'e1'} onBack={() => {}} />}
      {kind !== 'detail' && <TabBar c={c} active={kind} onChange={() => {}} />}
    </Phone>
  );
}

const PHONE_W = 391, PHONE_H = 828;

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);

  return (
    <div data-screen-label="00 Design Canvas">
      <DesignCanvas>

        <DCSection
          id="intro"
          title="Prediction Square · 先行版 — 原型 v2"
          subtitle="V2 Editorial 浅色 中密度（你选定的方向）→ 已扩展到 5 个 Tab + 详情页 + 投注流程。点 Tweaks 切换主题/密度。"
        >
          <DCArtboard id="brief" label="设计说明" width={520} height={620}>
            <div style={{ width: '100%', height: '100%', padding: 32, background: '#FFFCF5', display: 'flex', flexDirection: 'column', gap: 14, fontFamily: 'Inter, -apple-system, PingFang SC, sans-serif', color: '#1A1A1A' }}>
              <div style={{ fontFamily: 'Source Serif 4, Noto Serif SC, serif', fontSize: 26, fontWeight: 700, lineHeight: 1.2, letterSpacing: -0.4 }}>
                选定方向后的扩展<br/><span style={{ fontStyle: 'italic' }}>V2 Editorial · 浅色 · 中密度</span>
              </div>
              <div style={{ height: 1, background: 'rgba(0,0,0,0.08)' }} />
              <div style={{ fontSize: 13, lineHeight: 1.65, color: '#333' }}>
                <b>首页结构调整</b>：
                <ol style={{ paddingLeft: 18, margin: '6px 0' }}>
                  <li>顶部 H 滚动 <b>「今日热点」</b>（AI 实时设局，3 张大卡）</li>
                  <li>分类 tabs（推荐/热门/金融/科技…）</li>
                  <li>事件 feed</li>
                  <li>「<b>高手在押什么</b>」榜单卡片</li>
                  <li>「<b>热门观点</b>」社交</li>
                </ol>
              </div>
              <div style={{ fontSize: 13, lineHeight: 1.65, color: '#333' }}>
                <b>覆盖页面</b>：广场（首页）· 预测详情 + 完整投注流程（选边→金额→确认→成功）· 排行榜（日/周/月/总 + 三种指标）· 消息 · 我的（盈亏/胜率/标签/历史）· 快速入口 sheet。
              </div>
              <div style={{ fontSize: 13, lineHeight: 1.65, color: '#333' }}>
                <b>Tweaks 控件</b>：右上 Tweaks 按钮可切 浅/深 主题、中/高 密度。其他页面会跟随同步。
              </div>
              <div style={{ marginTop: 'auto', padding: 12, borderRadius: 10, background: 'rgba(31,58,138,0.08)', fontSize: 12.5, lineHeight: 1.55, color: '#1F3A8A' }}>
                右侧 <b>互动原型</b> 可点击：从首页点击任意事件卡 → 详情 → 完整下注流程；底 Tab 可切 5 个页面。下方 <b>静态对比</b> 展示所有页面浅/深主题的并列效果。
              </div>
            </div>
          </DCArtboard>

          <DCArtboard id="prototype" label="互动原型 · 完整流程" width={PHONE_W} height={PHONE_H}>
            <Prototype theme={tweaks.theme} density={tweaks.density} />
          </DCArtboard>
        </DCSection>

        <DCSection id="square" title="① 广场（首页）" subtitle="按你的需求：今日热点 → 分类 → feed → 高手榜 → 热门观点">
          <DCArtboard id="sq-dark-mid" label="深色 · 中密度" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="square" theme="dark" density="medium" />
          </DCArtboard>
          <DCArtboard id="sq-dark-dense" label="深色 · 高密度" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="square" theme="dark" density="high" />
          </DCArtboard>
          <DCArtboard id="sq-light-mid" label="浅色 · 中密度" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="square" theme="light" density="medium" />
          </DCArtboard>
        </DCSection>

        <DCSection id="detail" title="② 预测详情 + 投注流程" subtitle="标题 → 共识可视化 → AI 轻解读（可展开关键变量）→ 热门观点 → 下注 sheet → 成功反馈">
          <DCArtboard id="dt-light" label="详情 · 浅色" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="detail" theme="light" eventId="e1" />
          </DCArtboard>
          <DCArtboard id="dt-dark" label="详情 · 深色" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="detail" theme="dark" eventId="e1" />
          </DCArtboard>
          <DCArtboard id="dt-flow" label="下注 sheet（点原型体验）" width={PHONE_W} height={PHONE_H}>
            <Prototype initial="square" initialDetail="e1" theme="light" density="medium" />
          </DCArtboard>
        </DCSection>

        <DCSection id="rank" title="③ 排行榜" subtitle="日/周/月/总 × 收益率/胜率/连胜 · 三甲讲台 + 列表 + 我的位置">
          <DCArtboard id="rk-light" label="浅色" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="rank" theme="light" />
          </DCArtboard>
          <DCArtboard id="rk-dark" label="深色" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="rank" theme="dark" />
          </DCArtboard>
        </DCSection>

        <DCSection id="msg-me" title="④ 消息 + ⑤ 我的">
          <DCArtboard id="msg-light" label="消息 · 浅色" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="msg" theme="light" />
          </DCArtboard>
          <DCArtboard id="me-light" label="我的 · 浅色" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="me" theme="light" />
          </DCArtboard>
          <DCArtboard id="me-dark" label="我的 · 深色" width={PHONE_W} height={PHONE_H}>
            <StaticScreen kind="me" theme="dark" />
          </DCArtboard>
        </DCSection>

        <DCSection id="next" title="下一步候选" subtitle="可选扩展，告诉我做哪些">
          <DCArtboard id="next-card" label="待办清单" width={520} height={460}>
            <div style={{ width: '100%', height: '100%', padding: 28, background: '#FFFCF5', fontFamily: 'Inter, -apple-system, PingFang SC, sans-serif', color: '#1A1A1A' }}>
              <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 1.5, color: '#888', marginBottom: 8 }}>NEXT — PICK ANY</div>
              <div style={{ fontFamily: 'Source Serif 4, Noto Serif SC, serif', fontSize: 22, fontWeight: 700, letterSpacing: -0.3, lineHeight: 1.25, marginBottom: 14 }}>
                可以继续扩展的页面
              </div>
              <ul style={{ paddingLeft: 18, lineHeight: 1.85, fontSize: 13.5, color: '#333' }}>
                <li><b>结果页</b>（预测正确/错误的反馈 + AI 复盘报告）</li>
                <li><b>AI 复盘 · 逻辑图谱</b>（关键变量可视化关联）</li>
                <li><b>破产补给站</b>（学习恢复流程）</li>
                <li><b>分类页 / 搜索 / 高手主页</b></li>
                <li><b>新手引导 onboarding</b></li>
                <li><b>会员订阅页</b>（PRD §6.2）</li>
              </ul>
              <div style={{ marginTop: 14, padding: 12, borderRadius: 10, background: 'rgba(0,0,0,0.04)', fontSize: 12.5, lineHeight: 1.55, color: '#555' }}>
                也可以先对当前几页提反馈：色彩、字号、密度、文案、热点卡样式等都可以调。
              </div>
            </div>
          </DCArtboard>
        </DCSection>

      </DesignCanvas>

      <TweaksPanel title="Tweaks">
        <TweakSection title="主题">
          <TweakRadio label="主题" options={[{value:'light',label:'浅色'},{value:'dark',label:'深色'}]}
            value={tweaks.theme} onChange={(v) => setTweak('theme', v)} />
        </TweakSection>
        <TweakSection title="密度">
          <TweakRadio label="首页密度" options={[{value:'medium',label:'中密度'},{value:'high',label:'高密度'}]}
            value={tweaks.density} onChange={(v) => setTweak('density', v)} />
        </TweakSection>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
